[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjetra"
version = "1.0.0"
authors = [
    {name = "Ali VEX", email = "lyrdaadhrpyk802@gmail.com"}
]
description = "A modern, bilingual (Sync/Async) Python wrapper for the Jetra Bot API."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
    "aiohttp>=3.8.0"
]

[project.urls]
Homepage = "https://github.com/lyrdaadhrpyk802-ux/pyjetra"
Documentation = "https://github.com/lyrdaadhrpyk802-ux/pyjetra/blob/main/README.md"
Jetra = "https://jetra.ir/UserBoT"