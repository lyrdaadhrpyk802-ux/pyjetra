[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjetra"
version = "2.0.2"
description = "Python toolkit for Jetra Messenger: Bot API (sync/async) and User Account API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali VEX", email = "lyrdaadhrpyk802@gmail.com"}]
keywords = ["jetra", "messenger", "bot", "userbot", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
bot = ["requests>=2.25.0", "aiohttp>=3.8.0"]
user = ["websockets>=10.0", "pycryptodome>=3.15.0"]
all = ["requests>=2.25.0", "aiohttp>=3.8.0", "websockets>=10.0", "pycryptodome>=3.15.0"]

[project.urls]
Homepage = "https://github.com/lyrdaadhrpyk802-ux/pyjetra"
Repository = "https://github.com/lyrdaadhrpyk802-ux/pyjetra"
Issues = "https://github.com/lyrdaadhrpyk802-ux/pyjetra/issues"
Jetra = "https://jetra.ir/UserBoT"

[tool.setuptools.packages.find]
include = ["pyjetra*"]

[tool.setuptools.package-data]
"pyjetra.userapi" = ["py.typed"]
"pyjetra.botapi" = ["py.typed"]
